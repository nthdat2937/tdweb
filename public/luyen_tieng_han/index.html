<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tiếng Hàn</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --text: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f6fa;
            color: var(--text);
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .container:hover {
            transform: translateY(-2px);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5em;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .progress {
            background: #eee;
            height: 8px;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .score {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .score span {
            padding: 5px 15px;
            border-radius: 20px;
            background: #f8f9fa;
        }
        .word {
            font-size: 3em;
            margin: 30px 0;
            text-align: center;
            color: var(--text);
            font-weight: bold;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        input {
            padding: 12px 20px;
            font-size: 1.1em;
            width: 300px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74,144,226,0.2);
        }
        button {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #357abd;
            transform: translateY(-1px);
        }
        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            min-height: 30px;
            animation: fadeIn 0.3s;
        }
        .correct { 
            color: var(--success);
            font-weight: bold;
        }
        .wrong { 
            color: var(--error);
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Luyện Tiếng Hàn</div>
            <div class="progress">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="score">
                <span>Đúng: <b id="dung">0</b></span>
                <span>Sai: <b id="sai">0</b></span>
            </div>
        </div>
        <div class="word" id="word"></div>
        <div class="input-group">
            <input type="text" id="answer" placeholder="Nhập nghĩa tiếng Việt...">
            <button onclick="checkAnswer()">Kiểm tra</button>
        </div>
        <div id="result" class="result"></div>
    </div>

    <script>
        function removeAccents(str) {
            return str.normalize('NFD')
                     .replace(/[\u0300-\u036f]/g, '')
                     .replace(/đ/g, 'd')
                     .replace(/Đ/g, 'D');
        }

        const dictionary = {
            tieng_han: [],
            tieng_viet: [],
            tieng_anh: []
        };

        async function loadDictionary() {
            try {
                const response = await fetch('tu_dien.txt');
                if (!response.ok) {
                    throw new Error('Không thể tải file từ điển');
                }
                const text = await response.text();
                const lines = text.split('\n').map(line => line.trim()).filter(line => line);
                
                for (let i = 0; i < lines.length; i++) {
                    if (i % 3 === 0) {
                        dictionary.tieng_han.push(lines[i]);
                    } else if (i % 3 === 1) {
                        dictionary.tieng_anh.push(lines[i]);
                    } else if (i % 3 === 2) {
                        dictionary.tieng_viet.push(lines[i]);
                    }
                }
                getRandomWord();
            } catch (error) {
                alert('Lỗi khi tải từ điển: ' + error.message);
                console.error('Error loading dictionary:', error);
            }
        }

        let dung = 0;
        let sai = 0;
        let currentIndex;

        function getRandomWord() {
            currentIndex = Math.floor(Math.random() * dictionary.tieng_han.length);
            document.getElementById('word').textContent = dictionary.tieng_han[currentIndex];
            document.getElementById('answer').value = '';
            document.getElementById('result').textContent = '';
        }

        function checkAnswer() {
            const userAnswer = removeAccents(document.getElementById('answer').value.trim().toLowerCase());
            const correctAnswer = removeAccents(dictionary.tieng_viet[currentIndex].toLowerCase());
            const result = document.getElementById('result');

            if (userAnswer === correctAnswer) {
                result.textContent = "Chính xác!";
                result.className = 'result correct';
                dung++;
                setTimeout(getRandomWord, 500);
            } else {
                result.textContent = `Sai! Đáp án chính xác: ${dictionary.tieng_viet[currentIndex]}`;
                result.className = 'result wrong';
                sai++;
                setTimeout(getRandomWord, 1000);
            }

            document.getElementById('dung').textContent = dung;
            document.getElementById('sai').textContent = sai;

            // Update progress bar
            const progress = ((dung + sai) / 100) * 100;
            document.getElementById('progress').style.width = `${progress}%`;

            if (dung + sai >= 100) {
                alert(`Hoàn thành chương trình luyện tiếng Hàn!\nĐiểm số ${dung}/${dung+sai}`);
                location.reload();
            }
        }

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        loadDictionary();
    </script>
</body>
</html>
