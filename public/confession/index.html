<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Đánh giá & Góp ý</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #6366f1;
      --primary-hover: #5b5bf6;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --bg-light: #ffffff;
      --bg-dark: #0f172a;
      --card-light: rgba(255, 255, 255, 0.95);
      --card-dark: rgba(15, 23, 42, 0.95);
      --text-light: #1e293b;
      --text-dark: #f8fafc;
      --border-light: rgba(148, 163, 184, 0.2);
      --border-dark: rgba(148, 163, 184, 0.1);
      --shadow-light: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-dark: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      --glow: rgba(99, 102, 241, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    [data-theme="dark"] body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    /* Animated background particles */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .particle:nth-child(2n) {
      animation-delay: 2s;
      animation-duration: 8s;
    }

    .particle:nth-child(3n) {
      animation-delay: 4s;
      animation-duration: 10s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.6; }
      25% { transform: translateY(-20px) translateX(10px) rotate(90deg); opacity: 1; }
      50% { transform: translateY(0px) translateX(-10px) rotate(180deg); opacity: 0.8; }
      75% { transform: translateY(10px) translateX(15px) rotate(270deg); opacity: 1; }
    }

    .container {
      background: var(--card-light);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-light);
      position: relative;
      z-index: 10;
      transform: translateY(0);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] .container {
      background: var(--card-dark);
      border-color: var(--border-dark);
      box-shadow: var(--shadow-dark);
    }

    .container:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 64px -12px rgba(99, 102, 241, 0.25), var(--shadow-light);
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
      border-radius: 24px 24px 0 0;
      background-size: 300% 100%;
      animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      position: relative;
    }

    [data-theme="dark"] .header h1 {
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .header p {
      color: #64748b;
      font-weight: 400;
      font-size: 1.1rem;
    }

    [data-theme="dark"] .header p {
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-label {
      display: block;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-light);
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    [data-theme="dark"] .form-label {
      color: var(--text-dark);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: rgba(241, 245, 249, 0.8);
      color: var(--text-light);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      position: relative;
    }

    [data-theme="dark"] .form-input,
    [data-theme="dark"] .form-textarea {
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-dark);
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px var(--glow), 0 8px 16px -4px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    [data-theme="dark"] .form-input:focus,
    [data-theme="dark"] .form-textarea:focus {
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.3), 0 8px 16px -4px rgba(168, 85, 247, 0.2);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
      font-family: inherit;
    }

    .submit-btn {
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .submit-btn:hover:before {
      left: 100%;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), var(--secondary));
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    .submit-btn:active {
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.95rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--card-light);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-light);
      z-index: 100;
    }

    [data-theme="dark"] .theme-toggle {
      background: var(--card-dark);
      border-color: var(--border-dark);
      box-shadow: var(--shadow-dark);
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(180deg);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }

    /* Responsive design */
    @media (max-width: 640px) {
      .container {
        padding: 24px;
        margin: 16px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .theme-toggle {
        width: 48px;
        height: 48px;
        top: 16px;
        right: 16px;
      }
    }

    /* Enhanced focus indicators for accessibility */
    .form-input:focus,
    .form-textarea:focus,
    .submit-btn:focus,
    .theme-toggle:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="bg-animation" id="bgAnimation"></div>
  
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    🌙
  </button>

  <div class="container">
    <div class="header">
      <h1>Góp Ý</h1>
      <p>Chia sẻ ý kiến và đánh giá của bạn</p>
    </div>

    <form id="feedbackForm">
      <div class="form-group">
        <label class="form-label" for="nameInput">Tên của bạn (không bắt buộc)</label>
        <input 
          type="text" 
          id="nameInput"
          name="name" 
          class="form-input"
          placeholder="Nhập tên của bạn..."
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="messageInput">Nội dung <span style="color: #ef4444;">*</span></label>
        <textarea 
          id="messageInput"
          name="message" 
          class="form-textarea"
          placeholder="Chia sẻ ý kiến, đánh giá hoặc góp ý của bạn..."
          required
          rows="5"
        ></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="btnText">Gửi Góp Ý</span>
      </button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    // Check for saved theme preference or default to system preference
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme) {
      html.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    } else if (prefersDark) {
      html.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    }

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', newTheme);
    });

    // Animated background particles
    function createParticles() {
      const bgAnimation = document.getElementById('bgAnimation');
      const particleCount = 20;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        bgAnimation.appendChild(particle);
      }
    }

    // Form submission
    document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const form = e.target;
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const status = document.getElementById('status');
      const formData = new FormData(form);

      // Reset status
      status.className = 'status';
      status.textContent = '';

      // Show loading state
      submitBtn.disabled = true;
      btnText.innerHTML = 'Đang gửi... <span class="loading-spinner"></span>';

      try {
        const response = await fetch('https://formspree.io/f/myznzoll', {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          // Success - redirect after a short delay
          btnText.textContent = '✅ Gửi thành công!';
          setTimeout(() => {
            window.location.href = 'confession/thankyou.html';
          }, 1500);
        } else {
          throw new Error('Network response was not ok');
        }
      } catch (error) {
        // Show error message
        status.textContent = '❌ Có lỗi xảy ra, vui lòng thử lại sau.';
        status.className = 'status error show';
        
        // Reset button
        submitBtn.disabled = false;
        btnText.textContent = 'Gửi Góp Ý';
      }
    });

    // Initialize particles when page loads
    document.addEventListener('DOMContentLoaded', createParticles);

    // Add smooth scroll behavior
    document.documentElement.style.scrollBehavior = 'smooth';

    // Enhanced input interactions
    const inputs = document.querySelectorAll('.form-input, .form-textarea');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentNode.style.transform = 'translateY(-2px)';
      });
      
      input.addEventListener('blur', function() {
        this.parentNode.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
